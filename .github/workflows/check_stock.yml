name: Check Apple Refurbished Stock

on:
  schedule:
    # 日本時間 8:00 〜 22:59 の間、5分おきに実行 (UTC 23:00 〜 13:59)
    - cron: '*/5 23,0-13 * * *'
  # GitHub画面からの手動実行ボタン
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # キャッシュファイルをGitHub内部ストレージに自動保存・復元する（Gitコミット不要）
      - name: Restore stock cache
        uses: actions/cache@v4
        with:
          path: stock_cache.json
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py

